---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  labels:
    release: monitoring
  name: frontend-probe
spec:
  jobName: frontend
  prober:
    url: blackbox-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  module: http_2xx
  interval: 60s
  scrapeTimeout: 30s
  targets:
    staticConfig:
      labels:
        app: bank-of-anthos
      static:
        - frontend.default.svc.cluster.local:80
---
